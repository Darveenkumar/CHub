<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100vh;
  background: transparent; 
  font-family:'Inter',sans-serif;overflow-x:hidden}

/* HEADER SECTION CONTAINER WITH SOFT FADE BOTTOM */
.header-wrapper {
  position: relative;
  width: 100%;
  padding-bottom: 24px;
  overflow: visible;
  -webkit-mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
  mask-image: linear-gradient(to bottom, black 0%, black 55%, transparent 100%);
}

.page{
  position:relative;z-index:10;
  width:100%;
  display:flex;flex-direction:column;
  align-items:center;
  padding:0 clamp(24px,5vw,72px) 0;
  padding-top:0;
}

/* Floating interactive icons layer */
#icon-layer{position:absolute;inset:0;pointer-events:none;z-index:11;}
.ficon{position:absolute;display:flex;align-items:center;justify-content:center;width:32px;height:32px;background:none;border:none;}
.ficon svg{width:22px;height:22px;}

/* CLEO Bot Positioning */
.cleo-wrap{
  display:flex;justify-content:center;
  padding-top:clamp(16px,2vh,24px);
  position:relative;
  z-index:9999;
  width:100%;
  margin-bottom:-10px;
}
.cleo-area{
  display:flex;justify-content:center;
  will-change:transform;
  position:relative;
  z-index:9999;
}
.cleo-inner{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  animation:hoverfloat 4s 1s ease-in-out infinite;
  position:relative;
  z-index:9999;
  cursor:pointer;
}
@keyframes hoverfloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  28%{transform:translateY(-12px) rotate(-1.2deg)}
  55%{transform:translateY(-18px) rotate(.8deg)}
  78%{transform:translateY(-8px) rotate(-.6deg)}
}
.cleo-svg-wrap{
  filter:drop-shadow(0 12px 32px rgba(0,180,255,.32));
  width:clamp(88px,9vw,125px);
}
.cleo-name{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;gap:2px;}
.cleo-name span{font-family:'Syne',sans-serif;font-weight:700;font-size:clamp(11px,1vw,14px);letter-spacing:.1em;color:#00dcff;}

/* Layout Block for Text Elements */
.wordmark-section{
  position:relative;
  animation:fadeUp .8s .2s both;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  width: 100%;
  max-width: max-content; 
}

/* Background Vignette */
.wordmark-section::before {
  content: '';
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: clamp(1000px, 130vw, 1500px);
  height: clamp(1000px, 130vw, 1500px);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,185,255,0.28) 0%, rgba(0,150,255,0.09) 25%, rgba(0,150,255,0.02) 48%, rgba(0,150,255,0) 65%);
  z-index: -1;
  pointer-events: none;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.wordmark{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:clamp(64px,12vw,150px);
  line-height:.88;letter-spacing:-.04em;
  display:flex;align-items:baseline;gap:clamp(6px,.8vw,14px);
  white-space:nowrap;
  width: 100%;
}
.wm-core{
  background:linear-gradient(120deg,#00e5ff,#00b4ff,#7b8cff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200% 100%;animation:shimmer 6s linear infinite;
}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.wm-hub{color:rgba(255,255,255,.72);font-weight:700;}

/* FIXED: Tagline Row with Micro-Adjusted Inward Alignment */
.tagline-row{
  margin-top:12px;
  display:flex;align-items:baseline;justify-content:space-between;
  animation:fadeUp .8s .4s both;
  width:100%;
  padding-right: 2px;
}
/* Shshifted 8px inwards to hit the precise optical grid alignment line */
.tag-left{
  font-size:clamp(11px,1.1vw,14px);
  color:rgba(255,255,255,.55);
  font-weight:300;
  letter-spacing:.04em;
  white-space:nowrap;
  padding-left: 8px; 
}
.tag-left strong{color:rgba(0,220,255,.7);font-weight:400}
.tag-right{font-size:clamp(11px,1.1vw,14px);color:rgba(255,255,255,.55);font-weight:300;letter-spacing:.04em;white-space:nowrap;}

/* TINY GLITTER BACKGROUND STARS */
.star-field {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}
.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0;
  animation: twinkle var(--duration) infinite ease-in-out;
}
@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: var(--max-opacity); transform: scale(1.2); filter: drop-shadow(0 0 2px #00dcff); }
}
</style>
</head>
<body>

<div class="header-wrapper" id="headerBlock">
  <div class="star-field" id="starField"></div>
  <div id="icon-layer"></div>

  <div class="page">
    <div class="cleo-wrap">
      <div class="cleo-area" id="cleoArea">
        <div class="cleo-inner" id="cleoInner">
          <div class="cleo-svg-wrap">
            <svg viewBox="0 0 220 280" fill="none" xmlns="http://www.w3.org/2000/svg" width="100%">
              <defs>
                <radialGradient id="bG" cx="38%" cy="28%" r="68%"><stop offset="0%" stop-color="#f2fbff"/><stop offset="50%" stop-color="#cfeaf8"/><stop offset="100%" stop-color="#8fc6e6"/></radialGradient>
                <radialGradient id="hG" cx="36%" cy="26%" r="68%"><stop offset="0%" stop-color="#f4fcff"/><stop offset="45%" stop-color="#bce3f8"/><stop offset="100%" stop-color="#73bae2"/></radialGradient>
                <radialGradient id="vG" gradientUnits="userSpaceOnUse" cx="92" cy="70" r="96"><stop offset="0%" stop-color="#1f63a8"/><stop offset="50%" stop-color="#093058"/><stop offset="100%" stop-color="#03102a"/></radialGradient>
                <radialGradient id="ckG" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(255,150,170,.75)"/><stop offset="100%" stop-color="rgba(255,150,170,0)"/></radialGradient>
                <radialGradient id="gG" cx="35%" cy="28%" r="65%"><stop offset="0%" stop-color="#ffe080"/><stop offset="100%" stop-color="#c87800"/></radialGradient>
                <radialGradient id="rG" cx="40%" cy="30%" r="65%"><stop offset="0%" stop-color="#ff8a98"/><stop offset="100%" stop-color="#d23344"/></radialGradient>
                <linearGradient id="glG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,.55)"/><stop offset="100%" stop-color="rgba(255,255,255,0)"/></linearGradient>
                <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="rgba(0,0,0,.32)"/></filter>
                <filter id="sh2"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,.22)"/></filter>
                <filter id="gw"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                <clipPath id="visorClip"><rect x="48" y="54" width="124" height="62" rx="28"/></clipPath>
              </defs>
              <ellipse cx="110" cy="274" rx="50" ry="7" fill="rgba(0,180,255,.16)"><animate attributeName="rx" values="50;62;50" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".16;.26;.16" dur="4s" repeatCount="indefinite"/></ellipse>
              <line x1="110" y1="18" x2="110" y2="9" stroke="#9fd8f0" stroke-width="3" stroke-linecap="round"/>
              <circle cx="110" cy="7" r="4.5" fill="#00dcff" filter="url(#gw)"><animate attributeName="r" values="4;5.4;4" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;1;.8" dur="2.4s" repeatCount="indefinite"/></circle>
              <path d="M55 168 Q50 232 52 268 L168 268 Q170 232 165 168 Q148 154 110 152 Q72 154 55 168Z" fill="url(#bG)" filter="url(#sh)"/>
              <path d="M72 158 Q110 150 148 158 Q142 172 110 174 Q78 172 72 158Z" fill="url(#glG)" opacity=".5"/>
              <path d="M64 182 Q110 174 156 182" stroke="rgba(160,240,255,.45)" stroke-width="1.5" fill="none" stroke-linecap="round"><animate attributeName="opacity" values=".4;.8;.4" dur="2.2s" repeatCount="indefinite"/></path>
              <circle cx="84" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/><circle cx="110" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/><circle cx="136" cy="210" r="9" fill="url(#gG)" filter="url(#sh2)"/>
              <circle cx="81" cy="207" r="3" fill="rgba(255,255,255,.6)"/><circle cx="107" cy="207" r="3" fill="rgba(255,255,255,.6)"/><circle cx="133" cy="207" r="3" fill="rgba(255,255,255,.6)"/>
              <rect x="82" y="234" width="56" height="20" rx="8" fill="rgba(0,100,200,.25)" stroke="rgba(0,220,255,.5)" stroke-width="1"/>
              <text x="110" y="248" text-anchor="middle" font-family="'Syne',sans-serif" font-size="9" font-weight="800" fill="#00dcff" letter-spacing="2.5">CLEO</text>
              <path d="M57 170 Q30 188 26 220 Q24 238 34 242 Q46 246 52 230 Q58 212 68 186Z" fill="url(#bG)" filter="url(#sh2)"/><ellipse cx="32" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)"/><ellipse cx="30" cy="239" rx="8" ry="5" fill="url(#glG)" opacity=".4"/>
              <path d="M163 170 Q190 188 194 220 Q196 238 186 242 Q174 246 168 230 Q162 212 152 186Z" fill="url(#bG)" filter="url(#sh2)"/><ellipse cx="188" cy="243" rx="13" ry="15" fill="url(#bG)" filter="url(#sh2)"/><ellipse cx="186" cy="239" rx="8" ry="5" fill="url(#glG)" opacity=".4"/>
              <ellipse cx="110" cy="153" rx="24" ry="6" fill="url(#gG)" filter="url(#sh2)"/><ellipse cx="110" cy="151" rx="20" ry="4" fill="url(#glG)" opacity=".5"/>
              <rect x="94" y="134" width="32" height="22" rx="11" fill="url(#bG)" filter="url(#sh2)"/>
              <ellipse cx="110" cy="80" rx="71" ry="67" fill="url(#hG)" filter="url(#sh)"/><ellipse cx="88" cy="44" rx="40" ry="18" fill="url(#glG)" opacity=".42" transform="rotate(-10 88 44)"/>
              <ellipse cx="39" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/><ellipse cx="38" cy="82" rx="7" ry="8" fill="rgba(255,210,210,.45)"/>
              <ellipse cx="181" cy="86" rx="14" ry="17" fill="url(#rG)" filter="url(#sh2)"/><ellipse cx="180" cy="82" rx="7" ry="8" fill="rgba(255,210,210,.45)"/>
              <rect x="48" y="54" width="124" height="62" rx="28" fill="url(#vG)" stroke="rgba(120,210,255,.45)" stroke-width="1.5"/>
              <ellipse cx="66" cy="103" rx="9" ry="5.5" fill="url(#ckG)"><animate attributeName="opacity" values=".6;.95;.6" dur="3s" repeatCount="indefinite"/></ellipse>
              <ellipse cx="154" cy="103" rx="9" ry="5.5" fill="url(#ckG)"><animate attributeName="opacity" values=".6;.95;.6" dur="3s" repeatCount="indefinite"/></ellipse>
              <ellipse cx="84" cy="86" rx="15" ry="14" fill="white"/><circle cx="84" cy="86" r="10" fill="#1a1008"/><circle cx="84" cy="86" r="6" fill="#050200"/><circle cx="87.5" cy="82" r="2.8" fill="rgba(255,255,255,.9)"/>
              <ellipse cx="136" cy="86" rx="15" ry="14" fill="white"/><circle cx="136" cy="86" r="10" fill="#1a1008"/><circle cx="136" cy="86" r="6" fill="#050200"/><circle cx="139.5" cy="82" r="2.8" fill="rgba(255,255,255,.9)"/>
              <path d="M100 104 Q110 112 120 104" stroke="#5ef0ff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9"/>
              <ellipse id="lidLtop" cx="84" cy="86" rx="15" ry="0" fill="url(#vG)"/><ellipse id="lidLbot" cx="84" cy="86" rx="15" ry="0" fill="url(#vG)"/>
              <ellipse id="lidRtop" cx="136" cy="86" rx="15" ry="0" fill="url(#vG)"/><ellipse id="lidRbot" cx="136" cy="86" rx="15" ry="0" fill="url(#vG)"/>
              <g clip-path="url(#visorClip)"><ellipse cx="86" cy="64" rx="30" ry="10" fill="rgba(255,255,255,.16)" transform="rotate(-6 86 64)"/></g>
              <circle cx="110" cy="200" r="68" stroke="rgba(0,200,255,.07)" stroke-width="1.5" stroke-dasharray="4 9" fill="none"><animateTransform attributeName="transform" type="rotate" from="0 110 200" to="360 110 200" dur="18s" repeatCount="indefinite"/></circle>
            </svg>
          </div>
          <div class="cleo-name"><span>CLEO</span></div>
        </div>
      </div>
    </div>

    <div class="wordmark-section" id="wmSection">
      <div class="wordmark">
        <span class="wm-core">CORE</span><span class="wm-hub">HUB</span>
      </div>
      <div class="tagline-row" id="taglineBoundary">
        <span class="tag-left"><strong>CO</strong>mpliance &nbsp;·&nbsp; <strong>RE</strong>newal &nbsp;·&nbsp; Hub</span>
        <span class="tag-right">Contracts &nbsp;·&nbsp; Licences &nbsp;·&nbsp; Direct Purchases</span>
      </div>
    </div>
  </div>
</div>

<script>
/* Blinking Eye Mechanics */
function blink() {
  const closeSteps = 7, openSteps = 12, closeDur = 70, openDur = 150, maxRy = 14; 
  let f = 0;
  const eyes = [
    { top:'lidLtop', bot:'lidLbot', cx:84, eyeTop:72, eyeBot:100 },
    { top:'lidRtop', bot:'lidRbot', cx:136, eyeTop:72, eyeBot:100 }
  ];
  function setLids(p) {
    const ry = p * maxRy;
    eyes.forEach(e => {
      const tl = document.getElementById(e.top), bl = document.getElementById(e.bot);
      if(!tl||!bl) return;
      tl.setAttribute('ry', ry); tl.setAttribute('cy', e.eyeTop + ry);
      bl.setAttribute('ry', ry * 0.6); bl.setAttribute('cy', e.eyeBot - ry * 0.6);
    });
  }
  const ci = setInterval(() => {
    f++; setLids(f/closeSteps);
    if (f >= closeSteps) {
      clearInterval(ci); f = 0;
      setTimeout(() => {
        const oi = setInterval(() => {
          f++; setLids(1 - (f/openSteps));
          if (f >= openSteps) { clearInterval(oi); setLids(0); setTimeout(blink, 3000 + Math.random() * 3000); }
        }, openDur / openSteps);
      }, 45);
    }
  }, closeDur / closeSteps);
}
setTimeout(blink, 2000);

/* Floating Contextual Icons Setup */
const iconDefs = [
  {svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#00dcff" stroke-width="1.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`},
  {svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#4dffa0" stroke-width="1.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`},
  {svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#7b8cff" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`},
  {svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#f0c060" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`},
  {svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="1.5"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>`},
  {svg:`<svg viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>`}
];

const layer = document.getElementById('icon-layer'), cleoArea = document.getElementById('cleoArea');
const SIZE = 32, REPEL = 130, FORCE = 6, FRIC = 0.88, SPRING = 0.05;
let mouseX = window.innerWidth / 2, mouseY = 0, cleoCurrentX = 0, cleoTargetX = 0;

// Tracking state control metrics
let insideTrackingZone = true;
let outZoneTimestamp = 0;

document.addEventListener('mousemove', e => { 
  mouseX = e.clientX; 
  mouseY = e.clientY;
});

/* FIXED: Return to center cooldown timer and speed modifier logic */
function moveCleo() {
  const boundaryEl = document.getElementById('taglineBoundary');
  let currentlyInside = true;

  if (boundaryEl) {
    const boundaryY = boundaryEl.getBoundingClientRect().bottom + window.scrollY;
    if (mouseY > boundaryY) {
      currentlyInside = false;
    }
  }

  // State machine checking context switches
  if (currentlyInside) {
    insideTrackingZone = true;
    const cleoW = cleoArea.offsetWidth || 120;
    const amp = Math.max(60, window.innerWidth / 2 - cleoW / 2 - 24);
    cleoTargetX = ((mouseX / window.innerWidth) * 2 - 1) * amp;
    
    // Normal snap speed when following mouse active
    cleoCurrentX += (cleoTargetX - cleoCurrentX) * 0.06;
  } else {
    if (insideTrackingZone) {
      // Just crossed line: mark timestamp and freeze current position briefly
      insideTrackingZone = false;
      outZoneTimestamp = Date.now();
    }
    
    // Check if 2 seconds (2000ms) have passed since exiting the upper boundary zone
    if (Date.now() - outZoneTimestamp > 2000) {
      cleoTargetX = 0;
      // Ultra slow damping multiplier (0.012) for a very calm drift back home
      cleoCurrentX += (cleoTargetX - cleoCurrentX) * 0.012;
    }
    // Note: if less than 2 seconds, cleoCurrentX remains exactly where it was frozen
  }

  cleoArea.style.transform = `translateX(${cleoCurrentX}px)`;
  requestAnimationFrame(moveCleo);
}
moveCleo();

const fixedPos=[[0.05,10],[0.16,45],[0.28,25],[0.72,20],[0.84,45],[0.95,12]];
let particles = [];

function initParticles(){
  layer.innerHTML=''; particles=[];
  const wm=document.getElementById('wmSection'); if(!wm)return;
  const wmR=wm.getBoundingClientRect(), cleoR=document.getElementById('cleoInner').getBoundingClientRect();
  const cleoCY=cleoR.top+cleoR.height*0.42;
  
  fixedPos.forEach(([xr,yo],i)=>{
    const ox=wmR.left+wmR.width*xr, oy=cleoCY+yo;
    const el=document.createElement('div');
    el.className='ficon'; el.innerHTML=iconDefs[i].svg;
    el.style.left=(ox-SIZE/2)+'px'; el.style.top=(oy-SIZE/2)+'px'; el.style.opacity='0.45';
    layer.appendChild(el);
    particles.push({el,ox,oy,x:ox,y:oy,vx:0,vy:0});
  });
}

function loop(){
  const r=cleoArea.getBoundingClientRect();
  const cleoSX=r.left+r.width/2, cleoSY=r.top+r.height*0.42;
  particles.forEach(p=>{
    const dx=p.x-cleoSX,dy=p.y-cleoSY,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<REPEL&&dist>1){const f=(REPEL-dist)/REPEL*FORCE;p.vx+=(dx/dist)*f;p.vy+=(dy/dist)*f;}
    p.vx+=(p.ox-p.x)*SPRING; p.vy+=(p.oy-p.y)*SPRING; p.vx*=FRIC; p.vy*=FRIC; p.x+=p.vx; p.y+=p.vy;
    p.el.style.left=(p.x-SIZE/2)+'px'; p.el.style.top=(p.y-SIZE/2)+'px';
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    p.el.style.opacity=0.4+Math.min(spd*0.05,0.5);
  });
  requestAnimationFrame(loop);
}
initParticles(); setTimeout(initParticles,350); window.addEventListener('resize',initParticles); loop();

/* BACKGROUND STARFIELD SPARK GENERATOR */
function makeGlitters() {
  const container = document.getElementById('starField');
  const count = 45;
  for(let i=0; i<count; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 85 + '%'; 
    const size = Math.random() * 2 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.setProperty('--duration', (Math.random() * 3 + 2.5) + 's');
    star.style.setProperty('--max-opacity', (Math.random() * 0.5 + 0.3));
    star.style.animationDelay = (Math.random() * 4) + 's';
    container.appendChild(star);
  }
}
makeGlitters();
</script>
</body>
