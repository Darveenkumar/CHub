<script>
// =========================
// BLINK SYSTEM
// =========================
const HALF = 30;

function blink() {
  const duration = 120;
  const steps = 12;
  let frame = 0;

  const ids = [
    { top: 'lidLtop', bot: 'lidLbot' },
    { top: 'lidRtop', bot: 'lidRbot' }
  ];

  function ease(t) {
    return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
  }

  const close = setInterval(() => {
    frame++;
    const t = ease(frame / steps);
    const h = t * HALF;

    ids.forEach(e => {
      const tl = document.getElementById(e.top);
      const bl = document.getElementById(e.bot);
      if (!tl || !bl) return;

      tl.setAttribute('height', h);
      bl.setAttribute('y', 116 - h);
      bl.setAttribute('height', h);
    });

    if (frame >= steps) {
      clearInterval(close);
      frame = 0;

      const open = setInterval(() => {
        frame++;
        const t = ease(1 - frame / steps);
        const h = t * HALF;

        ids.forEach(e => {
          const tl = document.getElementById(e.top);
          const bl = document.getElementById(e.bot);
          if (!tl || !bl) return;

          tl.setAttribute('height', h);
          bl.setAttribute('y', 116 - h);
          bl.setAttribute('height', h);
        });

        if (frame >= steps) {
          clearInterval(open);
          setTimeout(blink, 2500 + Math.random() * 3000);
        }
      }, duration / steps);
    }
  }, duration / steps);
}

setTimeout(blink, 1800);


// =========================
// ICONS
// =========================
const layer = document.getElementById('icon-layer');

function initIcons() {
  layer.innerHTML = '';

  const icons = ["🔒","⚡","🛡️","⏱️","⚠️","📁"];

  icons.forEach((ic, i) => {
    const el = document.createElement('div');
    el.className = 'ficon';
    el.innerText = ic;

    el.style.left = (10 + i * 15) + '%';
    el.style.top = (40 + Math.sin(i) * 10) + '%';

    layer.appendChild(el);
  });
}

initIcons();


// =========================
// OPTIONAL CANVAS (simple)
// =========================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, pts = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

  pts = Array.from({length: 35}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.3,
    vy: (Math.random() - 0.5) * 0.3
  }));
}

function draw() {
  ctx.clearRect(0,0,W,H);

  pts.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;

    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;

    ctx.fillStyle = "rgba(0,200,255,.15)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

resize();
window.addEventListener('resize', resize);
draw();
</script>
